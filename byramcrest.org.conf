server {
    listen 80;
    listen 443 ssl;
    listen [::]:80;
    listen [::]:443 ssl;
    http2 on;

    server_name .byramcrest.org;
    ssl_certificate  /etc/letsencrypt/live/byramcrest.org/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/byramcrest.org/privkey.pem;

    access_log /var/log/nginx/access.log;

    location / {
        proxy_pass http://192.168.1.11:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header  X-Forwarded-Host $remote_addr;
    }
}
